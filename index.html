<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Githin Tom Zachariah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:          #0b1120;
      --bg:           #f8f7f4;
      --surface:      #ffffff;
      --text:         #18181b;
      --muted:        #71717a;
      --subtle:       #a1a1aa;
      --border:       #e4e4e7;
      --accent:       #1e4976;
      --accent-light: #e8f0f9;
      --max-width:    840px;
      --radius:       8px;
    }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      border-top: 3px solid var(--ink);
    }

    /* ── Header ────────────────────────────────────────────── */
    header {
      background: var(--bg);
      padding: 40px 24px 0;
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    header h1 {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    header h1::after {
      content: '';
      display: block;
      width: 52px;
      height: 2px;
      background: var(--ink);
      margin-top: 10px;
    }

    header p.tagline {
      margin-top: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Tabs ─────────────────────────────────────────────── */
    nav.tabs {
      margin: 28px 0 0;
      display: flex;
      border-bottom: 1px solid var(--ink);
    }

    nav.tabs button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 18px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      position: relative;
      transition: color 0.15s;
      letter-spacing: 0.01em;
    }

    nav.tabs button:first-child { padding-left: 0; }

    nav.tabs button::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--ink);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    nav.tabs button:first-child::after { left: 0; }
    nav.tabs button.active { color: var(--text); }
    nav.tabs button.active::after { transform: scaleX(1); }
    nav.tabs button:not(.active):hover { color: var(--text); }

    /* ── Tab panels ──────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Research panel ──────────────────────────────────────── */
    #research {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* Bio */
    .bio {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 52px;
    }

    .bio-photo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bio-photo-placeholder {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 0.72rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .bio-text h2 {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .bio-text p {
      font-size: 0.92rem;
      line-height: 1.75;
      color: #3f3f46;
    }

    .bio-links {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bio-links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      background: var(--accent-light);
      border: 1px solid #c3d9ef;
      border-radius: 20px;
      padding: 4px 12px;
      transition: background 0.15s, border-color 0.15s;
    }

    .bio-links a:hover {
      background: #d4e7f5;
      border-color: #9ec4e0;
    }

    /* Section labels */
    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    section { margin-bottom: 52px; }

    /* Publications */
    .pub-list { list-style: none; }

    .pub-item {
      display: flex;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .pub-item:first-child { border-top: 1px solid var(--border); }

    .pub-year {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 4px;
      padding: 2px 7px;
      height: fit-content;
      white-space: nowrap;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .pub-body { flex: 1; }

    .pub-title {
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 5px;
    }

    .pub-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .pub-links {
      margin-top: 7px;
      display: flex;
      gap: 10px;
    }

    .pub-links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid #c3d9ef;
      padding-bottom: 1px;
      transition: border-color 0.15s;
    }

    .pub-links a:hover { border-color: var(--accent); }

    /* Projects */
    .project-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px 22px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .project-card:hover {
      box-shadow: 0 4px 16px rgba(30, 73, 118, 0.08);
      border-color: #c3d9ef;
    }

    .project-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .project-card p {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── Photography panel ───────────────────────────────────── */
    #photography {
      /* Full-width — sits outside the constrained content column */
    }

    /* Hero */
    .photo-hero {
      width: 100%;
      min-height: 72vh;
      background: #0c0c0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .photo-hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.45;
    }

    .photo-hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 32px;
      max-width: 620px;
    }

    .photo-hero-content h2 {
      font-family: 'Lora', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 400;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .photo-hero-content p {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.85;
    }

    .photo-hero-chevron {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 2.2rem;
      line-height: 1;
      animation: chevron-bounce 2.4s ease-in-out infinite;
    }

    @keyframes chevron-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(8px); }
    }

    /* Album list */
    .album-section {
      width: 100%;
      cursor: pointer;
      display: block;
    }

    .album-cover-wrap {
      width: 100%;
      height: clamp(260px, 56vw, 540px);
      overflow: hidden;
    }

    .album-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease;
    }

    .album-section:hover .album-cover-img { transform: scale(1.04); }

    .album-cover-placeholder {
      width: 100%;
      height: 100%;
      background: #141418;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a2a30;
      font-size: 4rem;
    }

    .album-info {
      background: #000;
      padding: 28px 24px 34px;
      text-align: center;
    }

    .album-info h3 {
      font-family: 'Lora', serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .album-info p {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: #777;
      letter-spacing: 0.02em;
    }

    .album-divider {
      height: 1px;
      background: #1a1a1a;
    }

    /* Empty state */
    .album-list-empty {
      background: #000;
      padding: 80px 24px;
      text-align: center;
    }

    .album-list-empty p {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: #444;
      line-height: 1.9;
    }

    .album-list-empty code {
      font-family: monospace;
      color: #666;
    }

    /* Album detail view */
    .album-detail {
      background: #fff;
      min-height: 60vh;
      padding-bottom: 60px;
    }

    .album-detail-top {
      padding: 14px 20px 0;
    }

    .album-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      transition: color 0.15s;
    }

    .album-back-btn:hover { color: var(--text); }

    .album-detail-header {
      padding: 30px 24px 26px;
      text-align: center;
      border-bottom: 1px solid #ebebeb;
      margin-bottom: 6px;
    }

    .album-detail-header h3 {
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
    }

    /* Masonry grid */
    .photo-masonry {
      columns: 2;
      column-gap: 5px;
      padding: 5px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 5px;
      cursor: pointer;
      overflow: hidden;
      display: block;
      background: #f0f0f0;
    }

    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .masonry-item:hover img { transform: scale(1.04); }

    .masonry-placeholder {
      break-inside: avoid;
      margin-bottom: 5px;
      background: #efefef;
      aspect-ratio: 3/2;
    }

    /* ── Lightbox ────────────────────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 12, 0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .lightbox-close {
      position: absolute;
      top: 18px; right: 22px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.9rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s;
    }

    .lightbox-close:hover { opacity: 1; }

    .lightbox-caption {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: var(--bg);
      color: var(--subtle);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--ink);
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .project-grid { grid-template-columns: 1fr; }
      .bio { flex-direction: column; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 id="site-name"></h1>
      <p class="tagline" id="site-tagline"></p>
      <nav class="tabs" role="tablist">
        <button class="active" onclick="switchTab('research')" role="tab" aria-selected="true">Research</button>
        <button onclick="switchTab('photography')" role="tab" aria-selected="false">Photography</button>
      </nav>
    </div>
  </header>

  <!-- Research panel — constrained width -->
  <div id="research" class="panel active">
    <section class="bio" id="bio-section"></section>
    <section id="publications-section"></section>
    <section id="projects-section"></section>
  </div>

  <!-- Photography panel — full width -->
  <div id="photography" class="panel">
    <div class="photo-hero" id="photo-hero"></div>
    <div id="album-list"></div>
    <div id="album-detail" class="album-detail" style="display:none"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <footer id="site-footer"></footer>

  <script src="data.js"></script>
  <script>
    function el(tag, className) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      return e;
    }

    function textWithItalics(str) {
      const frag = document.createDocumentFragment();
      str.split(/(\*[^*]+\*)/g).forEach(part => {
        if (part.startsWith('*') && part.endsWith('*')) {
          const em = document.createElement('em');
          em.textContent = part.slice(1, -1);
          frag.appendChild(em);
        } else {
          frag.appendChild(document.createTextNode(part));
        }
      });
      return frag;
    }

    // ── Render ───────────────────────────────────────────────
    function render() {

      // Header
      document.getElementById('site-name').textContent = SITE.name;
      document.getElementById('site-tagline').textContent =
        [SITE.role, SITE.institution, SITE.email].join(' · ');

      // Bio
      const bioSection = document.getElementById('bio-section');
      if (SITE.photo) {
        const img = el('img', 'bio-photo');
        img.src = SITE.photo;
        img.alt = SITE.name;
        bioSection.appendChild(img);
      } else {
        const ph = el('div', 'bio-photo-placeholder');
        ph.textContent = 'photo';
        bioSection.appendChild(ph);
      }
      const bioText = el('div', 'bio-text');
      const h2 = el('h2');
      h2.textContent = 'About me';
      const bioP = el('p');
      bioP.appendChild(textWithItalics(SITE.bio));
      const bioLinks = el('div', 'bio-links');
      SITE.links.filter(l => l.url).forEach(l => {
        const a = el('a');
        a.href = l.url;
        a.textContent = l.label;
        if (l.url.startsWith('http')) a.target = '_blank';
        bioLinks.appendChild(a);
      });
      bioText.append(h2, bioP, bioLinks);
      bioSection.appendChild(bioText);

      // Publications
      const pubSection = document.getElementById('publications-section');
      const pubLabel = el('p', 'section-label');
      pubLabel.textContent = 'Publications';
      const pubList = el('ul', 'pub-list');
      SITE.publications.forEach(pub => {
        const li = el('li', 'pub-item');
        const yr = el('span', 'pub-year');
        yr.textContent = pub.year;
        const body = el('div', 'pub-body');
        const title = el('p', 'pub-title');
        title.textContent = pub.title;
        const meta = el('p', 'pub-meta');
        meta.appendChild(document.createTextNode(pub.authors + ' · '));
        const em = document.createElement('em');
        em.textContent = pub.venue;
        meta.appendChild(em);
        body.append(title, meta);
        if (pub.doi) {
          const links = el('div', 'pub-links');
          const a = el('a');
          a.href = pub.doi;
          a.textContent = 'DOI';
          a.target = '_blank';
          links.appendChild(a);
          body.appendChild(links);
        }
        li.append(yr, body);
        pubList.appendChild(li);
      });
      pubSection.append(pubLabel, pubList);

      // Projects
      const projSection = document.getElementById('projects-section');
      const projLabel = el('p', 'section-label');
      projLabel.textContent = 'Projects';
      const grid = el('div', 'project-grid');
      SITE.projects.forEach(proj => {
        const card = el('div', 'project-card');
        const h3 = el('h3');
        h3.textContent = proj.title;
        const p = el('p');
        p.textContent = proj.description;
        card.append(h3, p);
        grid.appendChild(card);
      });
      projSection.append(projLabel, grid);

      // Photography — hero
      const hero = document.getElementById('photo-hero');
      const heroData = SITE.photoHero || {};
      if (heroData.cover) {
        const bg = el('div', 'photo-hero-bg');
        bg.style.backgroundImage = 'url(' + heroData.cover + ')';
        hero.appendChild(bg);
      }
      const heroContent = el('div', 'photo-hero-content');
      const heroTitle = el('h2');
      heroTitle.textContent = heroData.title || 'Photography';
      const heroSub = el('p');
      heroSub.textContent = heroData.subtitle || '';
      heroContent.append(heroTitle, heroSub);
      hero.appendChild(heroContent);
      const chevron = el('div', 'photo-hero-chevron');
      chevron.innerHTML = '&#8964;';
      hero.appendChild(chevron);

      // Photography — album list
      const albumList = document.getElementById('album-list');
      const albums = SITE.albums || [];
      if (albums.length === 0) {
        const empty = el('div', 'album-list-empty');
        empty.innerHTML =
          '<p>Add albums to <code>albums: []</code> in data.js<br>to display your photography here.</p>';
        albumList.appendChild(empty);
      } else {
        albums.forEach((album, idx) => {
          const section = el('div', 'album-section');
          section.addEventListener('click', () => openAlbum(idx));

          const wrap = el('div', 'album-cover-wrap');
          if (album.cover) {
            const img = el('img', 'album-cover-img');
            img.src = album.cover;
            img.alt = album.title;
            img.loading = 'lazy';
            wrap.appendChild(img);
          } else {
            const ph = el('div', 'album-cover-placeholder');
            ph.textContent = '▲';
            wrap.appendChild(ph);
          }
          section.appendChild(wrap);

          const info = el('div', 'album-info');
          const h3 = el('h3');
          h3.textContent = album.title;
          const p = el('p');
          p.textContent = album.subtitle || '';
          info.append(h3, p);
          section.appendChild(info);

          albumList.appendChild(section);
          if (idx < albums.length - 1) {
            albumList.appendChild(el('div', 'album-divider'));
          }
        });
      }

      // Footer
      document.getElementById('site-footer').textContent =
        '© ' + new Date().getFullYear() + ' ' + SITE.name;
    }

    // ── Album navigation ─────────────────────────────────────
    function openAlbum(idx) {
      const album = (SITE.albums || [])[idx];
      if (!album) return;

      const albumList = document.getElementById('album-list');
      const hero = document.getElementById('photo-hero');
      const detail = document.getElementById('album-detail');

      hero.style.display = 'none';
      albumList.style.display = 'none';
      detail.style.display = 'block';
      detail.innerHTML = '';

      const top = el('div', 'album-detail-top');
      const backBtn = el('button', 'album-back-btn');
      backBtn.innerHTML = '← All albums';
      backBtn.addEventListener('click', closeAlbum);
      top.appendChild(backBtn);
      detail.appendChild(top);

      const header = el('div', 'album-detail-header');
      const h3 = el('h3');
      h3.textContent = album.title;
      header.appendChild(h3);
      detail.appendChild(header);

      const masonry = el('div', 'photo-masonry');
      const photos = album.photos || [];
      if (photos.length === 0) {
        for (let i = 0; i < 6; i++) {
          masonry.appendChild(el('div', 'masonry-placeholder'));
        }
      } else {
        photos.forEach(photo => {
          const item = el('div', 'masonry-item');
          item.addEventListener('click', e => {
            e.stopPropagation();
            openLightbox(photo.src, photo.caption || '');
          });
          const img = el('img');
          img.src = photo.src;
          img.alt = photo.caption || '';
          img.loading = 'lazy';
          item.appendChild(img);
          masonry.appendChild(item);
        });
      }
      detail.appendChild(masonry);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeAlbum() {
      const detail = document.getElementById('album-detail');
      const albumList = document.getElementById('album-list');
      const hero = document.getElementById('photo-hero');
      detail.style.display = 'none';
      hero.style.display = 'flex';
      albumList.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Tab switching ────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav.tabs button').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.getElementById(name).classList.add('active');
      const btn = [...document.querySelectorAll('nav.tabs button')]
        .find(b => b.textContent.toLowerCase() === name);
      if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected', 'true'); }
    }

    // ── Lightbox ─────────────────────────────────────────────
    function openLightbox(src, caption) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxImg').alt = caption;
      document.getElementById('lightboxCaption').textContent = caption;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    // ── Init ─────────────────────────────────────────────────
    render();
  </script>

</body>
</html>
