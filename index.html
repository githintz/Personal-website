<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Githin Tom Zachariah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --frame:        #0b1120;
      --frame-text:   #e2e8f0;
      --bg:           #f8f7f4;
      --surface:      #ffffff;
      --text:         #18181b;
      --muted:        #71717a;
      --subtle:       #a1a1aa;
      --border:       #e4e4e7;
      --accent:       #1e4976;
      --accent-light: #e8f0f9;
      --max-width:    840px;
      --radius:       8px;
    }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--frame);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────── */
    header {
      background: var(--frame);
      padding: 40px 24px 0;
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    header h1 {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--frame-text);
    }

    header p.tagline {
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: rgba(226, 232, 240, 0.55);
      letter-spacing: 0.01em;
    }

    /* ── Tabs ─────────────────────────────────────────────── */
    nav.tabs {
      margin: 28px 0 0;
      display: flex;
    }

    nav.tabs button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 18px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(226, 232, 240, 0.5);
      position: relative;
      transition: color 0.15s;
      letter-spacing: 0.01em;
    }

    nav.tabs button:first-child { padding-left: 0; }

    nav.tabs button::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--frame-text);
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    nav.tabs button:first-child::after { left: 0; }
    nav.tabs button.active { color: var(--frame-text); }
    nav.tabs button.active::after { transform: scaleX(1); }
    nav.tabs button:not(.active):hover { color: var(--frame-text); }

    /* ── Content column (the light card on dark bg) ─────────── */
    .content-column {
      max-width: calc(var(--max-width) + 48px);
      margin: 0 auto;
      background: var(--bg);
      min-height: 80vh;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
    }

    /* ── Tab panels ──────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Research panel ──────────────────────────────────────── */
    #research {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* Bio */
    .bio {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 52px;
    }

    .bio-photo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bio-photo-placeholder {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 0.72rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .bio-text h2 {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .bio-text p {
      font-size: 0.92rem;
      line-height: 1.75;
      color: #3f3f46;
    }

    .bio-links {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bio-links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      background: var(--accent-light);
      border: 1px solid #c3d9ef;
      border-radius: 20px;
      padding: 4px 12px;
      transition: background 0.15s, border-color 0.15s;
    }

    .bio-links a:hover {
      background: #d4e7f5;
      border-color: #9ec4e0;
    }

    /* Section labels */
    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    section { margin-bottom: 52px; }

    /* Publications */
    .pub-list { list-style: none; }

    .pub-item {
      display: flex;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .pub-item:first-child { border-top: 1px solid var(--border); }

    .pub-year {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 4px;
      padding: 2px 7px;
      height: fit-content;
      white-space: nowrap;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .pub-body { flex: 1; }

    .pub-title {
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 5px;
    }

    .pub-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .pub-links {
      margin-top: 7px;
      display: flex;
      gap: 10px;
    }

    .pub-links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid #c3d9ef;
      padding-bottom: 1px;
      transition: border-color 0.15s;
    }

    .pub-links a:hover { border-color: var(--accent); }

    /* Projects */
    .project-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px 22px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .project-card:hover {
      box-shadow: 0 4px 16px rgba(30, 73, 118, 0.08);
      border-color: #c3d9ef;
    }

    .project-card h3 {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .project-card p {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── Photography panel ───────────────────────────────────── */
    #photography {
      padding: 48px 0 80px;
    }

    .photo-intro {
      max-width: var(--max-width);
      margin: 0 auto 32px;
      padding: 0 24px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      color: var(--muted);
      font-style: italic;
    }

    .photo-strip-wrapper { position: relative; }

    .photo-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 24px 20px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
    }

    .photo-strip:active { cursor: grabbing; }
    .photo-strip::-webkit-scrollbar { height: 3px; }
    .photo-strip::-webkit-scrollbar-track { background: transparent; }
    .photo-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .photo-item {
      flex-shrink: 0;
      scroll-snap-align: start;
      height: 420px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.2s;
    }

    .photo-item:hover { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14); }

    .photo-item img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .photo-item:hover img { transform: scale(1.03); }

    .photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 32px 16px 14px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .photo-item:hover .photo-caption { opacity: 1; }

    .photo-placeholder {
      flex-shrink: 0;
      scroll-snap-align: start;
      height: 420px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: var(--subtle);
    }

    .photo-placeholder .icon { font-size: 2rem; opacity: 0.25; }

    /* ── Lightbox ────────────────────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      background: none;
      border: none;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.15s;
    }

    .lightbox-close:hover { opacity: 1; }

    .lightbox-caption {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: var(--frame);
      color: rgba(226, 232, 240, 0.35);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-align: center;
      padding: 20px 24px;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .project-grid { grid-template-columns: 1fr; }
      .bio { flex-direction: column; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 id="site-name"></h1>
      <p class="tagline" id="site-tagline"></p>
      <nav class="tabs" role="tablist">
        <button class="active" onclick="switchTab('research')" role="tab" aria-selected="true">Research</button>
        <button onclick="switchTab('photography')" role="tab" aria-selected="false">Photography</button>
      </nav>
    </div>
  </header>

  <div class="content-column">

    <!-- Research panel -->
    <div id="research" class="panel active">
      <section class="bio" id="bio-section"></section>
      <section id="publications-section"></section>
      <section id="projects-section"></section>
    </div>

    <!-- Photography panel -->
    <div id="photography" class="panel">
      <div class="photo-intro" id="photo-intro"></div>
      <div class="photo-strip-wrapper">
        <div class="photo-strip" id="photoStrip"></div>
      </div>
    </div>

  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <footer id="site-footer"></footer>

  <script src="data.js"></script>
  <script>
    // ── Helpers ──────────────────────────────────────────────
    // Interprets *word* as <em>word</em>, rest as plain text.
    function textWithItalics(str) {
      const frag = document.createDocumentFragment();
      str.split(/(\*[^*]+\*)/g).forEach(part => {
        if (part.startsWith('*') && part.endsWith('*')) {
          const em = document.createElement('em');
          em.textContent = part.slice(1, -1);
          frag.appendChild(em);
        } else {
          frag.appendChild(document.createTextNode(part));
        }
      });
      return frag;
    }

    function el(tag, className) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      return e;
    }

    // ── Render ───────────────────────────────────────────────
    function render() {

      // Header
      document.getElementById('site-name').textContent = SITE.name;
      document.getElementById('site-tagline').textContent =
        [SITE.role, SITE.institution, SITE.email].join(' · ');

      // Bio
      const bioSection = document.getElementById('bio-section');
      if (SITE.photo) {
        const img = el('img', 'bio-photo');
        img.src = SITE.photo;
        img.alt = SITE.name;
        bioSection.appendChild(img);
      } else {
        const ph = el('div', 'bio-photo-placeholder');
        ph.textContent = 'photo';
        bioSection.appendChild(ph);
      }
      const bioText = el('div', 'bio-text');
      const h2 = el('h2');
      h2.textContent = 'About me';
      const bioP = el('p');
      bioP.appendChild(textWithItalics(SITE.bio));
      const bioLinks = el('div', 'bio-links');
      SITE.links.filter(l => l.url).forEach(l => {
        const a = el('a');
        a.href = l.url;
        a.textContent = l.label;
        if (l.url.startsWith('http')) a.target = '_blank';
        bioLinks.appendChild(a);
      });
      bioText.append(h2, bioP, bioLinks);
      bioSection.appendChild(bioText);

      // Publications
      const pubSection = document.getElementById('publications-section');
      const pubLabel = el('p', 'section-label');
      pubLabel.textContent = 'Publications';
      const pubList = el('ul', 'pub-list');
      SITE.publications.forEach(pub => {
        const li = el('li', 'pub-item');
        const yr = el('span', 'pub-year');
        yr.textContent = pub.year;
        const body = el('div', 'pub-body');
        const title = el('p', 'pub-title');
        title.textContent = pub.title;
        const meta = el('p', 'pub-meta');
        meta.appendChild(document.createTextNode(pub.authors + ' \u00b7 '));
        const em = document.createElement('em');
        em.textContent = pub.venue;
        meta.appendChild(em);
        body.append(title, meta);
        if (pub.doi) {
          const links = el('div', 'pub-links');
          const a = el('a');
          a.href = pub.doi;
          a.textContent = 'DOI';
          a.target = '_blank';
          links.appendChild(a);
          body.appendChild(links);
        }
        li.append(yr, body);
        pubList.appendChild(li);
      });
      pubSection.append(pubLabel, pubList);

      // Projects
      const projSection = document.getElementById('projects-section');
      const projLabel = el('p', 'section-label');
      projLabel.textContent = 'Projects';
      const grid = el('div', 'project-grid');
      SITE.projects.forEach(proj => {
        const card = el('div', 'project-card');
        const h3 = el('h3');
        h3.textContent = proj.title;
        const p = el('p');
        p.textContent = proj.description;
        card.append(h3, p);
        grid.appendChild(card);
      });
      projSection.append(projLabel, grid);

      // Photography
      document.getElementById('photo-intro').textContent = SITE.photoIntro;
      const strip = document.getElementById('photoStrip');
      if (!SITE.photos || SITE.photos.length === 0) {
        [
          { w: 300, text: 'Add your photos' },
          { w: 280, text: 'Add { src, caption } objects' },
          { w: 320, text: 'to photos: [ ] in data.js' },
        ].forEach(ph => {
          const d = el('div', 'photo-placeholder');
          d.style.width = ph.w + 'px';
          const icon = el('span', 'icon');
          icon.textContent = '\u25b6';
          const label = el('span');
          label.textContent = ph.text;
          d.append(icon, label);
          strip.appendChild(d);
        });
      } else {
        SITE.photos.forEach(photo => {
          const item = el('div', 'photo-item');
          item.addEventListener('click', () => openLightbox(item));
          const img = el('img');
          img.src = photo.src;
          img.alt = photo.caption || '';
          if (photo.width) item.style.width = photo.width + 'px';
          const cap = el('div', 'photo-caption');
          cap.textContent = photo.caption || '';
          item.append(img, cap);
          strip.appendChild(item);
        });
      }

      // Footer — year auto-updates
      document.getElementById('site-footer').textContent =
        '\u00a9 ' + new Date().getFullYear() + ' ' + SITE.name;
    }

    // ── Tab switching ────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav.tabs button').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.getElementById(name).classList.add('active');
      const btn = [...document.querySelectorAll('nav.tabs button')]
        .find(b => b.textContent.toLowerCase() === name);
      if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected', 'true'); }
    }

    // ── Lightbox ─────────────────────────────────────────────
    function openLightbox(el) {
      const img = el.querySelector('img');
      const cap = el.querySelector('.photo-caption');
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightboxImg').alt = img.alt;
      document.getElementById('lightboxCaption').textContent = cap ? cap.textContent : '';
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    // ── Drag-to-scroll ────────────────────────────────────────
    const strip = document.getElementById('photoStrip');
    let isDown = false, startX, scrollLeft;
    strip.addEventListener('mousedown', e => {
      isDown = true;
      startX = e.pageX - strip.offsetLeft;
      scrollLeft = strip.scrollLeft;
    });
    strip.addEventListener('mouseleave', () => isDown = false);
    strip.addEventListener('mouseup', () => isDown = false);
    strip.addEventListener('mousemove', e => {
      if (!isDown) return;
      e.preventDefault();
      strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX);
    });

    // ── Init ─────────────────────────────────────────────────
    render();
  </script>

</body>
</html>
