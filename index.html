<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Githin Tom Zachariah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..400;1,9..144,200..400&family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       TOKENS & RESET
       ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f9f7f3;
      --surface: #ffffff;
      --ink:     #0f1217;
      --text:    #1c1c26;
      --muted:   #68687c;
      --subtle:  #a2a2b2;
      --border:  #e4e0d8;
      --accent:  #1d3557;
      --serif:   'Fraunces', Georgia, serif;
      --body:    'Lora', Georgia, serif;
      --sans:    'Inter', system-ui, sans-serif;
      --max:     960px;
      --ease:    cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(29, 53, 87, 0.15); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--subtle); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

    /* ═══════════════════════════════════════════
       PROGRESS BAR
       ═══════════════════════════════════════════ */
    #progress {
      position: fixed; top: 0; left: 0; z-index: 200;
      height: 2px; width: 0%;
      background: var(--accent);
      transition: width 0.08s linear;
      transform-origin: left;
    }

    /* ═══════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════ */
    header {
      position: sticky; top: 0; z-index: 100;
      padding: 22px 32px;
      display: flex; align-items: center; justify-content: space-between;
      transition: padding 0.4s var(--ease), background 0.4s var(--ease),
                  border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
      border-bottom: 1px solid transparent;
      background: transparent;
    }

    header.scrolled {
      padding: 14px 32px;
      background: rgba(249, 247, 243, 0.97);
      border-bottom-color: var(--border);
      box-shadow: 0 1px 20px rgba(15, 18, 23, 0.04);
    }

    .monogram {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--text);
      background: none; border: none;
      cursor: pointer; padding: 0;
      transition: color 0.2s var(--ease);
    }

    .monogram:hover { color: var(--accent); }

    nav.tabs {
      position: relative;
      display: flex; gap: 2px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
    }

    nav.tabs .indicator {
      position: absolute;
      top: 4px; left: 0;
      height: calc(100% - 8px);
      border-radius: 99px;
      background: var(--accent);
      transition: transform 0.42s var(--ease), width 0.42s var(--ease);
    }

    nav.tabs button {
      position: relative; z-index: 1;
      background: none; border: none; cursor: pointer;
      padding: 8px 22px;
      font-family: var(--sans);
      font-size: 0.82rem; font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--muted);
      border-radius: 99px;
      transition: color 0.25s var(--ease);
    }

    nav.tabs button.active { color: #fff; }
    nav.tabs button:not(.active):hover { color: var(--text); }

    /* ═══════════════════════════════════════════
       PANELS
       ═══════════════════════════════════════════ */
    .panel { display: none; }
    .panel.active { display: block; animation: panel-in 0.55s var(--ease); }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    /* ═══════════════════════════════════════════
       HERO
       ═══════════════════════════════════════════ */
    .hero {
      min-height: 84vh;
      display: flex; flex-direction: column; justify-content: center;
      max-width: var(--max);
      margin: 0 auto;
      padding: 80px 32px 100px;
    }

    .hero-eyebrow {
      font-family: var(--sans);
      font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 36px;
      display: flex; align-items: center; gap: 14px;
      opacity: 0;
      animation: fade-up 0.7s var(--ease) 0.1s forwards;
    }

    .hero-eyebrow::before {
      content: '';
      width: 36px; height: 1px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .hero h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(3.2rem, 9.5vw, 7.2rem);
      line-height: 1.0;
      letter-spacing: -0.025em;
      margin-bottom: 36px;
    }

    .hero h1 .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.85s var(--ease), transform 0.85s var(--ease);
    }

    .hero h1.in .word { opacity: 1; transform: none; }

    .hero-role {
      font-family: var(--body);
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      font-style: italic;
      color: var(--muted);
      margin-bottom: 8px;
      opacity: 0;
      animation: fade-up 0.7s var(--ease) 0.55s forwards;
    }

    .hero-email {
      font-family: var(--sans);
      font-size: 0.85rem;
      color: var(--subtle);
      letter-spacing: 0.01em;
      margin-bottom: 44px;
      opacity: 0;
      animation: fade-up 0.7s var(--ease) 0.7s forwards;
    }

    .hero-actions {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 64px;
      opacity: 0;
      animation: fade-up 0.7s var(--ease) 0.85s forwards;
    }

    .hero-rule {
      width: 100%; height: 1px;
      background: var(--border);
      margin-bottom: 48px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 1.1s var(--ease) 0.9s;
    }

    .hero-rule.drawn { transform: scaleX(1); }

    .hero-stats {
      display: flex; gap: clamp(36px, 7vw, 88px); flex-wrap: wrap;
      opacity: 0;
      animation: fade-up 0.7s var(--ease) 1.1s forwards;
    }

    .stat .num {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 3.8vw, 2.8rem);
      font-weight: 300;
      line-height: 1.1;
      color: var(--text);
    }

    .stat .lbl {
      font-family: var(--sans);
      font-size: 0.67rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--subtle);
      margin-top: 6px;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ═══════════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 22px;
      border-radius: 99px;
      font-family: var(--sans);
      font-size: 0.82rem; font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none; cursor: pointer;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease),
                  color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .btn-primary {
      background: var(--accent); color: #fff;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background: #152840; border-color: #152840;
      box-shadow: 0 4px 16px rgba(29, 53, 87, 0.24);
    }

    .btn-ghost {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ═══════════════════════════════════════════
       SECTION LAYOUT
       ═══════════════════════════════════════════ */
    .section {
      max-width: var(--max);
      margin: 0 auto;
      padding: 72px 32px;
      border-top: 1px solid var(--border);
    }

    .section-head {
      display: flex; align-items: baseline; gap: 20px;
      margin-bottom: 52px;
    }

    .section-head .idx {
      font-family: var(--sans);
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--accent);
    }

    .section-head h2 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .section-head h2 em { font-style: italic; }

    /* ═══════════════════════════════════════════
       BIO CARD
       ═══════════════════════════════════════════ */
    .bio-card {
      display: flex; gap: 44px; align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px;
      transition: box-shadow 0.35s var(--ease);
    }

    .bio-card:hover { box-shadow: 0 6px 36px rgba(15, 18, 23, 0.07); }

    .bio-photo-ring {
      flex-shrink: 0;
      width: 124px; height: 124px;
      border-radius: 50%;
      border: 2px solid var(--border);
      overflow: hidden;
      transition: border-color 0.3s var(--ease);
    }

    .bio-card:hover .bio-photo-ring { border-color: var(--accent); }

    .bio-photo {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    .bio-photo-placeholder {
      width: 100%; height: 100%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--sans);
      font-size: 0.72rem; color: var(--subtle);
    }

    .bio-text p {
      font-family: var(--body);
      font-size: 0.97rem;
      line-height: 1.9;
      color: var(--muted);
    }

    .bio-text p em { color: var(--text); font-style: italic; }

    .bio-links {
      margin-top: 22px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    /* ═══════════════════════════════════════════
       PUBLICATIONS
       ═══════════════════════════════════════════ */
    .pub-list { list-style: none; }

    .pub-item {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 28px;
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      transition: padding-left 0.3s var(--ease);
      position: relative;
    }

    .pub-item:first-child { border-top: 1px solid var(--border); }

    .pub-item::before {
      content: '';
      position: absolute; left: 0;
      top: 28px; bottom: 28px;
      width: 2px; border-radius: 2px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.35s var(--ease);
    }

    .pub-item:hover { padding-left: 16px; }
    .pub-item:hover::before { transform: scaleY(1); }

    .pub-year {
      font-family: var(--sans);
      font-size: 0.78rem; font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.04em;
      padding-top: 4px;
    }

    .pub-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.04rem;
      line-height: 1.55;
      margin-bottom: 8px;
      color: var(--text);
    }

    .pub-meta {
      font-family: var(--sans);
      font-size: 0.8rem; color: var(--subtle);
      line-height: 1.6;
    }

    .pub-meta em { font-style: italic; color: var(--muted); }

    .pub-doi {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 9px;
      font-family: var(--sans);
      font-size: 0.75rem; font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(29, 53, 87, 0.3);
      padding-bottom: 1px;
      transition: border-color 0.2s, color 0.2s;
    }

    .pub-doi::after { content: '↗'; font-size: 0.75em; opacity: 0.7; }
    .pub-doi:hover { border-color: var(--accent); }

    /* ═══════════════════════════════════════════
       PROJECTS
       ═══════════════════════════════════════════ */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 30px 30px 30px 28px;
      transition: box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .project-card:hover {
      box-shadow: 0 4px 28px rgba(15, 18, 23, 0.07);
      border-color: rgba(29, 53, 87, 0.35);
      border-left-color: var(--accent);
    }

    .project-card .pnum {
      display: block;
      font-family: var(--sans);
      font-size: 0.67rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 16px;
    }

    .project-card h3 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.18rem;
      line-height: 1.35;
      margin-bottom: 12px;
      color: var(--text);
    }

    .project-card p {
      font-family: var(--sans);
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.75;
    }

    /* ═══════════════════════════════════════════
       SCROLL REVEAL
       ═══════════════════════════════════════════ */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
      transition-delay: var(--d, 0ms);
    }

    .reveal.in { opacity: 1; transform: none; }

    /* ═══════════════════════════════════════════
       PHOTOGRAPHY — HERO
       ═══════════════════════════════════════════ */
    .photo-hero {
      width: 100%; min-height: 76vh;
      background: var(--ink);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    .photo-hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0.38;
      transform: scale(1.05);
      animation: slow-zoom 20s ease-in-out infinite alternate;
    }

    @keyframes slow-zoom { to { transform: scale(1); } }

    .photo-hero::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(15, 18, 23, 0.6));
    }

    .photo-hero-content {
      position: relative; z-index: 1;
      text-align: center;
      padding: 0 32px; max-width: 600px;
    }

    .photo-hero-content h2 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.01em; line-height: 1.1;
      color: #fff;
      margin-bottom: 22px;
    }

    .photo-hero-content p {
      font-family: var(--body);
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.8;
    }

    .photo-hero-chevron {
      position: absolute; z-index: 1;
      bottom: 32px; left: 50%;
      color: rgba(255, 255, 255, 0.35);
      font-size: 2rem; line-height: 1;
      animation: chevron-drift 2.6s ease-in-out infinite;
    }

    @keyframes chevron-drift {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(10px); }
    }

    /* ═══════════════════════════════════════════
       ALBUMS
       ═══════════════════════════════════════════ */
    .album-section { width: 100%; cursor: pointer; display: block; }

    .album-cover-wrap {
      width: 100%;
      height: clamp(280px, 56vw, 560px);
      overflow: hidden;
    }

    .album-cover-img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .album-section:hover .album-cover-img { transform: scale(1.04); }

    .album-cover-placeholder {
      width: 100%; height: 100%;
      background: #1a1a24;
      display: flex; align-items: center; justify-content: center;
      color: #2c2c38; font-size: 4rem;
    }

    .album-info {
      background: var(--ink);
      padding: 32px 24px 40px;
      text-align: center;
    }

    .album-info h3 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 1.55rem;
      letter-spacing: 0.01em;
      color: #f0ede8;
      margin-bottom: 10px;
      transition: color 0.3s var(--ease);
    }

    .album-section:hover .album-info h3 { color: #fff; }

    .album-info p {
      font-family: var(--body);
      font-style: italic;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.01em;
    }

    .album-divider {
      height: 1px;
      max-width: 160px;
      margin: 0 auto;
      background: #2a2a36;
    }

    .album-list-empty {
      background: var(--ink);
      padding: 80px 24px;
      text-align: center;
    }

    .album-list-empty p {
      font-family: var(--sans);
      font-size: 0.82rem;
      color: #444;
      line-height: 2;
    }

    .album-list-empty code { color: #666; }

    /* ═══════════════════════════════════════════
       ALBUM DETAIL (MASONRY)
       ═══════════════════════════════════════════ */
    .album-detail {
      background: var(--bg);
      min-height: 60vh;
      padding-bottom: 80px;
    }

    .album-detail-top {
      padding: 22px 32px 0;
      max-width: var(--max);
      margin: 0 auto;
    }

    .album-back-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease),
                  transform 0.3s var(--ease);
    }

    .album-back-btn:hover {
      color: var(--accent); border-color: var(--accent);
      transform: translateX(-4px);
    }

    .album-detail-header {
      padding: 48px 32px 40px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .album-detail-header h3 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .photo-masonry {
      columns: 2; column-gap: 6px;
      padding: 6px;
      max-width: 1400px; margin: 0 auto;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 6px;
      cursor: zoom-in;
      overflow: hidden;
      display: block;
      border-radius: 2px;
      background: var(--border);
    }

    .masonry-item img {
      width: 100%; height: auto; display: block;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
    }

    .masonry-item:hover img { transform: scale(1.03); }

    .masonry-placeholder {
      break-inside: avoid;
      margin-bottom: 6px;
      background: var(--border);
      border-radius: 2px;
      aspect-ratio: 3/2;
    }

    /* ═══════════════════════════════════════════
       LIGHTBOX
       ═══════════════════════════════════════════ */
    .lightbox {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(10, 12, 16, 0.94);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.35s var(--ease), visibility 0.35s;
    }

    .lightbox.open { opacity: 1; visibility: visible; }

    .lightbox img {
      max-width: 90vw; max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
      transform: scale(0.96);
      transition: transform 0.38s var(--ease);
    }

    .lightbox.open img { transform: scale(1); }

    .lightbox-close {
      position: absolute; top: 18px; right: 24px;
      background: none; border: none; color: #fff;
      font-size: 1.8rem; line-height: 1;
      cursor: pointer; opacity: 0.45;
      transition: opacity 0.2s, transform 0.3s var(--ease);
    }

    .lightbox-close:hover { opacity: 1; transform: rotate(90deg); }

    .lb-arrow {
      position: absolute; top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      width: 50px; height: 50px;
      color: #fff; font-size: 1.3rem;
      cursor: pointer; opacity: 0.5;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, background 0.2s;
    }

    .lb-arrow:hover { opacity: 1; background: rgba(255, 255, 255, 0.14); }
    .lb-arrow.prev { left: 22px; }
    .lb-arrow.next { right: 22px; }
    .lb-arrow.hidden { display: none; }

    .lightbox-caption {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      font-family: var(--sans);
      font-size: 0.75rem; letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.45);
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════
       FOOTER & TO-TOP
       ═══════════════════════════════════════════ */
    footer {
      border-top: 1px solid var(--border);
      margin-top: 0;
      padding: 40px 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
      max-width: var(--max); margin-left: auto; margin-right: auto;
    }

    footer .foot-name {
      font-family: var(--serif);
      font-weight: 400; font-size: 0.95rem;
      letter-spacing: 0.03em; color: var(--muted);
    }

    footer .foot-meta {
      font-family: var(--sans);
      font-size: 0.72rem; letter-spacing: 0.08em;
      color: var(--subtle);
    }

    #to-top {
      position: fixed; right: 28px; bottom: 28px; z-index: 150;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 1rem; cursor: pointer;
      opacity: 0; visibility: hidden;
      transform: translateY(12px);
      transition: opacity 0.35s var(--ease), visibility 0.35s,
                  transform 0.35s var(--ease), border-color 0.2s,
                  box-shadow 0.2s;
    }

    #to-top.show { opacity: 1; visibility: visible; transform: none; }

    #to-top:hover {
      border-color: var(--accent); color: var(--accent);
      box-shadow: 0 4px 16px rgba(29, 53, 87, 0.14);
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════ */
    @media (max-width: 720px) {
      .project-grid { grid-template-columns: 1fr; }
      .bio-card { flex-direction: column; gap: 24px; padding: 28px; }
      .pub-item { grid-template-columns: 1fr; gap: 6px; }
      .hero { min-height: calc(86vh - 68px); padding: 60px 20px 80px; }
      header { padding: 18px 20px; }
      header.scrolled { padding: 12px 20px; }
      nav.tabs button { padding: 8px 16px; font-size: 0.78rem; }
      footer { flex-direction: column; text-align: center; }
      .album-detail-top { padding: 18px 20px 0; }
      .lb-arrow.prev { left: 10px; }
      .lb-arrow.next { right: 10px; }
      .section { padding: 56px 20px; }
    }

    @media (min-width: 1100px) {
      .photo-masonry { columns: 3; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; }
      .hero h1 .word { opacity: 1; transform: none; }
      .hero-rule { transform: scaleX(1); }
    }
  </style>
</head>
<body>

  <div id="progress"></div>

  <header id="site-header">
    <button class="monogram" id="monogram" aria-label="Back to top"></button>
    <nav class="tabs" role="tablist">
      <div class="indicator" id="tab-indicator"></div>
      <button class="active" data-tab="research" role="tab" aria-selected="true">Research</button>
      <button data-tab="photography" role="tab" aria-selected="false">Photography</button>
    </nav>
  </header>

  <!-- ── Research ─────────────────────────────────── -->
  <main id="research" class="panel active">

    <section class="hero">
      <p class="hero-eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-name" aria-label=""></h1>
      <p class="hero-role"   id="hero-role"></p>
      <p class="hero-email"  id="hero-email"></p>
      <div class="hero-actions" id="hero-actions"></div>
      <div class="hero-rule" id="hero-rule"></div>
      <div class="hero-stats" id="hero-stats"></div>
    </section>

    <section class="section" id="about-section">
      <div class="section-head reveal">
        <span class="idx">01</span>
        <h2>About <em>me</em></h2>
      </div>
      <div class="bio-card reveal" id="bio-card"></div>
    </section>

    <section class="section" id="publications-section">
      <div class="section-head reveal">
        <span class="idx">02</span>
        <h2>Selected <em>publications</em></h2>
      </div>
      <ul class="pub-list" id="pub-list"></ul>
    </section>

    <section class="section" id="projects-section">
      <div class="section-head reveal">
        <span class="idx">03</span>
        <h2>Research <em>projects</em></h2>
      </div>
      <div class="project-grid" id="project-grid"></div>
    </section>

  </main>

  <!-- ── Photography ──────────────────────────────── -->
  <main id="photography" class="panel">
    <div class="photo-hero"   id="photo-hero"></div>
    <div id="album-list"></div>
    <div id="album-detail" class="album-detail" style="display:none"></div>
  </main>

  <!-- ── Lightbox ─────────────────────────────────── -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lb-arrow prev" aria-label="Previous">&#8249;</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lb-arrow next" aria-label="Next">&#8250;</button>
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <footer>
    <span class="foot-name" id="foot-name"></span>
    <span class="foot-meta" id="foot-meta"></span>
  </footer>

  <button id="to-top" aria-label="Back to top">&#8593;</button>

  <script src="data.js"></script>
  <script>
    'use strict';

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function el(tag, cls) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      return e;
    }

    function textWithItalics(str) {
      const frag = document.createDocumentFragment();
      str.split(/(\*[^*]+\*)/g).forEach(part => {
        if (part.startsWith('*') && part.endsWith('*')) {
          const em = document.createElement('em');
          em.textContent = part.slice(1, -1);
          frag.appendChild(em);
        } else {
          frag.appendChild(document.createTextNode(part));
        }
      });
      return frag;
    }

    /* ── Scroll reveal ─────────────────────────────── */
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });

    function observeReveals(root) {
      (root || document).querySelectorAll('.reveal:not(.in)').forEach(n => io.observe(n));
    }

    /* ── Count-up ──────────────────────────────────── */
    function countUp(node, target, suffix) {
      if (reducedMotion) { node.textContent = target + (suffix || ''); return; }
      const dur = 1400, t0 = performance.now();
      (function tick(t) {
        const p = Math.min((t - t0) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        node.textContent = Math.round(target * e) + (suffix || '');
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }

    /* ── Render ────────────────────────────────────── */
    function render() {

      /* Header monogram */
      const initials = SITE.name.split(/\s+/).map(w => w[0]).join('');
      document.getElementById('monogram').textContent = initials;

      /* Hero */
      document.getElementById('hero-eyebrow').textContent = SITE.institution;
      document.getElementById('hero-role').textContent = SITE.role;
      document.getElementById('hero-email').textContent = SITE.email;

      /* Hero name — word-by-word reveal */
      const nameEl = document.getElementById('hero-name');
      nameEl.setAttribute('aria-label', SITE.name);
      const words = SITE.name.split(/\s+/);
      words.forEach((word, wi) => {
        const s = el('span', 'word');
        s.setAttribute('aria-hidden', 'true');
        s.textContent = word;
        s.style.transitionDelay = (wi * 140) + 'ms';
        nameEl.appendChild(s);
        if (wi < words.length - 1) nameEl.appendChild(document.createTextNode(' '));
      });
      setTimeout(() => nameEl.classList.add('in'), 60);

      /* Hero rule draw-in */
      const rule = document.getElementById('hero-rule');
      if (!reducedMotion) setTimeout(() => rule.classList.add('drawn'), 500);
      else rule.classList.add('drawn');

      /* Hero actions */
      const actions = document.getElementById('hero-actions');
      SITE.links.filter(l => l.url).forEach((l, i) => {
        const a = el('a', i === 0 ? 'btn btn-primary' : 'btn btn-ghost');
        a.href = l.url; a.textContent = l.label;
        if (l.url.startsWith('http')) a.target = '_blank';
        actions.appendChild(a);
      });

      /* Hero stats */
      const years = SITE.publications.map(p => parseInt(p.year)).filter(n => !isNaN(n));
      const since = years.length ? Math.min(...years) : new Date().getFullYear();
      const statsData = [
        { n: SITE.publications.length, lbl: 'Publications' },
        { n: SITE.projects.length,     lbl: 'Projects' },
        { n: new Date().getFullYear() - since, lbl: 'Years active', suffix: '+' },
      ];
      const statsWrap = document.getElementById('hero-stats');
      const counters = [];
      statsData.forEach(s => {
        const d = el('div', 'stat');
        const num = el('div', 'num'); num.textContent = '0';
        const lbl = el('div', 'lbl'); lbl.textContent = s.lbl;
        d.append(num, lbl); statsWrap.appendChild(d);
        counters.push(() => countUp(num, s.n, s.suffix));
      });
      setTimeout(() => counters.forEach(fn => fn()), 950);

      /* Bio */
      const bioCard = document.getElementById('bio-card');
      const ring = el('div', 'bio-photo-ring');
      if (SITE.photo) {
        const img = el('img', 'bio-photo');
        img.src = SITE.photo; img.alt = SITE.name;
        ring.appendChild(img);
      } else {
        const ph = el('div', 'bio-photo-placeholder');
        ph.textContent = 'photo'; ring.appendChild(ph);
      }
      bioCard.appendChild(ring);

      const bioText = el('div', 'bio-text');
      const bioP = el('p'); bioP.appendChild(textWithItalics(SITE.bio));
      const bioLinks = el('div', 'bio-links');
      SITE.links.filter(l => l.url).forEach((l, i) => {
        const a = el('a', i === 0 ? 'btn btn-primary' : 'btn btn-ghost');
        a.href = l.url; a.textContent = l.label;
        if (l.url.startsWith('http')) a.target = '_blank';
        bioLinks.appendChild(a);
      });
      bioText.append(bioP, bioLinks);
      bioCard.appendChild(bioText);

      /* Publications */
      const pubList = document.getElementById('pub-list');
      SITE.publications.forEach((pub, i) => {
        const li = el('li', 'pub-item reveal');
        li.style.setProperty('--d', (i % 4) * 60 + 'ms');
        const yr = el('span', 'pub-year'); yr.textContent = pub.year;
        const body = el('div');
        const title = el('p', 'pub-title'); title.textContent = pub.title;
        const meta = el('p', 'pub-meta');
        meta.appendChild(document.createTextNode(pub.authors + ' · '));
        const em = document.createElement('em'); em.textContent = pub.venue;
        meta.appendChild(em);
        body.append(title, meta);
        if (pub.doi) {
          const a = el('a', 'pub-doi');
          a.href = pub.doi; a.target = '_blank'; a.textContent = 'DOI';
          body.appendChild(a);
        }
        li.append(yr, body); pubList.appendChild(li);
      });

      /* Projects */
      const grid = document.getElementById('project-grid');
      SITE.projects.forEach((proj, i) => {
        const card = el('div', 'project-card reveal');
        card.style.setProperty('--d', (i % 2) * 80 + 'ms');
        const num = el('span', 'pnum');
        num.textContent = String(i + 1).padStart(2, '0');
        const h3 = el('h3'); h3.textContent = proj.title;
        const p = el('p'); p.textContent = proj.description;
        card.append(num, h3, p); grid.appendChild(card);
      });

      /* Photography hero */
      const hero = document.getElementById('photo-hero');
      const hd = SITE.photoHero || {};
      if (hd.cover) {
        const bg = el('div', 'photo-hero-bg');
        bg.style.backgroundImage = 'url(' + hd.cover + ')';
        hero.appendChild(bg);
      }
      const hc = el('div', 'photo-hero-content');
      const ht = el('h2'); ht.textContent = hd.title || 'Photography';
      const hs = el('p'); hs.textContent = hd.subtitle || '';
      hc.append(ht, hs); hero.appendChild(hc);
      const chev = el('div', 'photo-hero-chevron');
      chev.innerHTML = '&#8964;'; hero.appendChild(chev);

      /* Album list */
      const albumList = document.getElementById('album-list');
      const albums = SITE.albums || [];
      if (albums.length === 0) {
        const empty = el('div', 'album-list-empty');
        empty.innerHTML = '<p>Add albums to <code>albums: []</code> in data.js.</p>';
        albumList.appendChild(empty);
      } else {
        albums.forEach((album, idx) => {
          const section = el('div', 'album-section reveal');
          section.addEventListener('click', () => openAlbum(idx));
          const wrap = el('div', 'album-cover-wrap');
          if (album.cover) {
            const img = el('img', 'album-cover-img');
            img.src = album.cover; img.alt = album.title; img.loading = 'lazy';
            wrap.appendChild(img);
          } else {
            const ph = el('div', 'album-cover-placeholder');
            ph.textContent = '▲'; wrap.appendChild(ph);
          }
          section.appendChild(wrap);
          const info = el('div', 'album-info');
          const h3 = el('h3'); h3.textContent = album.title;
          const p = el('p'); p.textContent = album.subtitle || '';
          info.append(h3, p); section.appendChild(info);
          albumList.appendChild(section);
          if (idx < albums.length - 1) albumList.appendChild(el('div', 'album-divider'));
        });
      }

      /* Footer */
      document.getElementById('foot-name').textContent = SITE.name;
      document.getElementById('foot-meta').textContent =
        '© ' + new Date().getFullYear() + ' · ' + SITE.institution;

      observeReveals();
    }

    /* ── Album navigation ──────────────────────────── */
    function openAlbum(idx) {
      const album = (SITE.albums || [])[idx];
      if (!album) return;
      document.getElementById('photo-hero').style.display = 'none';
      document.getElementById('album-list').style.display = 'none';
      const detail = document.getElementById('album-detail');
      detail.style.display = 'block'; detail.innerHTML = '';

      const top = el('div', 'album-detail-top');
      const back = el('button', 'album-back-btn');
      back.innerHTML = '&larr;&nbsp; All albums';
      back.addEventListener('click', closeAlbum);
      top.appendChild(back); detail.appendChild(top);

      const header = el('div', 'album-detail-header');
      const h3 = el('h3'); h3.textContent = album.title;
      header.appendChild(h3); detail.appendChild(header);

      const masonry = el('div', 'photo-masonry');
      const photos = album.photos || [];
      if (photos.length === 0) {
        for (let i = 0; i < 6; i++) masonry.appendChild(el('div', 'masonry-placeholder'));
      } else {
        photos.forEach((photo, i) => {
          const item = el('div', 'masonry-item reveal');
          item.style.setProperty('--d', (i % 3) * 65 + 'ms');
          item.addEventListener('click', e => { e.stopPropagation(); openLightbox(photos, i); });
          const img = el('img');
          img.src = photo.src; img.alt = photo.caption || ''; img.loading = 'lazy';
          item.appendChild(img); masonry.appendChild(item);
        });
      }
      detail.appendChild(masonry);
      observeReveals(detail);
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
    }

    function closeAlbum() {
      document.getElementById('album-detail').style.display = 'none';
      document.getElementById('photo-hero').style.display = 'flex';
      document.getElementById('album-list').style.display = 'block';
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
    }

    /* ── Tabs ──────────────────────────────────────── */
    const tabNav = document.querySelector('nav.tabs');
    const indicator = document.getElementById('tab-indicator');

    function moveIndicator(btn) {
      const r = btn.getBoundingClientRect();
      const nr = tabNav.getBoundingClientRect();
      indicator.style.width = r.width + 'px';
      indicator.style.transform = 'translateX(' + (r.left - nr.left - 4) + 'px)';
    }

    function switchTab(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav.tabs button').forEach(b => {
        const on = b.dataset.tab === name;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', String(on));
        if (on) moveIndicator(b);
      });
      document.getElementById(name).classList.add('active');
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
      observeReveals();
    }

    document.querySelectorAll('nav.tabs button').forEach(b => {
      b.addEventListener('click', () => switchTab(b.dataset.tab));
    });
    window.addEventListener('resize', () => {
      const active = document.querySelector('nav.tabs button.active');
      if (active) moveIndicator(active);
    });
    document.getElementById('monogram').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
    });

    /* ── Lightbox ──────────────────────────────────── */
    let lbPhotos = [], lbIdx = 0;
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lightboxImg');
    const lbCaption = document.getElementById('lightboxCaption');
    const lbPrev    = lightbox.querySelector('.lb-arrow.prev');
    const lbNext    = lightbox.querySelector('.lb-arrow.next');

    function showLightboxPhoto() {
      const p = lbPhotos[lbIdx];
      lbImg.src = p.src; lbImg.alt = p.caption || '';
      lbCaption.textContent = p.caption || '';
      const single = lbPhotos.length < 2;
      lbPrev.classList.toggle('hidden', single);
      lbNext.classList.toggle('hidden', single);
    }

    function openLightbox(photos, idx) {
      lbPhotos = photos; lbIdx = idx;
      showLightboxPhoto();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function stepLightbox(dir) {
      lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
      showLightboxPhoto();
    }

    lightbox.addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lbImg.addEventListener('click', e => e.stopPropagation());
    lbPrev.addEventListener('click', e => { e.stopPropagation(); stepLightbox(-1); });
    lbNext.addEventListener('click', e => { e.stopPropagation(); stepLightbox(1); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   stepLightbox(-1);
      if (e.key === 'ArrowRight')  stepLightbox(1);
    });

    /* ── Scroll behaviors ──────────────────────────── */
    const headerEl = document.getElementById('site-header');
    const progress = document.getElementById('progress');
    const toTop    = document.getElementById('to-top');

    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      headerEl.classList.toggle('scrolled', y > 30);
      toTop.classList.toggle('show', y > 600);
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
    }, { passive: true });

    toTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
    });

    /* ── Init ──────────────────────────────────────── */
    render();
    moveIndicator(document.querySelector('nav.tabs button.active'));
  </script>

</body>
</html>
